<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キッズページ - たのしい旅のしおり</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --bg-color: #F4F9F4;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --accent-color: #FF9800;
      --border-color: #E0E0E0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .section-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 1.2rem;
      color: var(--primary-color);
      border-bottom: 2px dashed var(--primary-color);
      padding-bottom: 6px;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 1. めあて・じこしょうかい */
    .profile-grid {
      display: grid;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-weight: bold;
      font-size: 0.9rem;
    }

    .input-group input {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }

    /* 2. クイズ・ミッション（スタンプラリー） */
    .mission-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .mission-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .mission-item:last-child {
      border-bottom: none;
    }

    .mission-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .mission-checkbox {
      width: 22px;
      height: 22px;
      accent-color: var(--primary-color);
    }

    .stamp-badge {
      background-color: var(--accent-color);
      color: white;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* 3. おえかき・ぬりえスペース */
    .canvas-container {
      text-align: center;
    }

    canvas {
      border: 2px dashed var(--primary-color);
      border-radius: 8px;
      background-color: #FFFFFF;
      touch-action: none; /* スマホでのスクロール防止 */
      max-width: 100%;
    }

    .canvas-tools {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-clear {
      background-color: #f44336;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎈 きっず ぺーじ 🎈</h1>

  <!-- 1. めあて・じこしょうかい -->
  <section class="section-card">
    <h2 class="section-title">✏️ たびのめあて & じこしょうかい</h2>
    <div class="profile-grid">
      <div class="input-group">
        <label for="child-name">なまえ：</label>
        <input type="text" id="child-name" placeholder="なまえをいれてね">
      </div>
      <div class="input-group">
        <label for="child-goal">たびの めあて：</label>
        <input type="text" id="child-goal" placeholder="例：いっぱいあそぶ！、ごはんをのこさない">
      </div>
      <div class="input-group">
        <label for="child-favorite">いちばん たのしみなこと：</label>
        <input type="text" id="child-favorite" placeholder="例：おんせん、いちごがり">
      </div>
    </div>
  </section>

  <!-- 2. クイズ・スタンプラリー -->
  <section class="section-card">
    <h2 class="section-title">🔍 みっしょん（ミッション）</h2>
    <p style="font-size: 0.85rem; color: #666; margin-top: -8px; margin-bottom: 12px;">みつけたり、できたりしたら チェックしてね！</p>
    <ul class="mission-list">
      <li class="mission-item">
        <label class="mission-label">
          <input type="checkbox" class="mission-checkbox">
          <span>🚗 あかい くるまを 3だい みつける</span>
        </label>
        <span class="stamp-badge">クリア！</span>
      </li>
      <li class="mission-item">
        <label class="mission-label">
          <input type="checkbox" class="mission-checkbox">
          <span>🌸 きれいな はなを みつける</span>
        </label>
        <span class="stamp-badge">クリア！</span>
      </li>
      <li class="mission-item">
        <label class="mission-label">
          <input type="checkbox" class="mission-checkbox">
          <span>🤝 みんなに 「ありがとう」を いう</span>
        </label>
        <span class="stamp-badge">クリア！</span>
      </li>
      <li class="mission-item">
        <label class="mission-label">
          <input type="checkbox" class="mission-checkbox">
          <span>♨️ おんせんに はいる・おふろを たのしむ</span>
        </label>
        <span class="stamp-badge">クリア！</span>
      </li>
    </ul>
  </section>

  <!-- 3. おえかき・ぬりえスペース -->
  <section class="section-card">
    <h2 class="section-title">🎨 自由におえかき</h2>
    <div class="canvas-container">
      <canvas id="paintCanvas" width="300" height="200"></canvas>
      <div class="canvas-tools">
        <button class="btn btn-clear" id="clearBtn">けす</button>
      </div>
    </div>
  </section>
</div>

<script>
  // お絵描きキャンバスの動作スクリプト
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');
  const clearBtn = document.getElementById('clearBtn');
  let isDrawing = false;

  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#333333';

  function startDrawing(e) {
    isDrawing = true;
    draw(e);
  }

  function stopDrawing() {
    isDrawing = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  // マウスイベント
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mousemove', draw);

  // タッチイベント（スマホ対応）
  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchend', stopDrawing);
  canvas.addEventListener('touchmove', draw);

  // クリアボタン
  clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
</script>

</body>
</html>
