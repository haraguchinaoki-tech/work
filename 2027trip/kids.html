<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きっずぺーじ - たびのしおり</title>
  <style>
    /* 印刷基本設定 */
    @page {
      size: A4;
      margin: 10mm;
    }

    :root {
      --main-color: #4CAF50;
      --text-color: #222222;
      --border-color: #888888;
    }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      color: var(--text-color);
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
    }

    .page-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .header-title {
      text-align: center;
      font-size: 1.8rem;
      color: var(--main-color);
      border-bottom: 3px dashed var(--main-color);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .section-box {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      background-color: #FFFFFF;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--main-color);
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 1. めあて・じこしょうかい */
    .profile-fields {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .field-line {
      display: flex;
      align-items: flex-end;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .field-line .line {
      flex-grow: 1;
      border-bottom: 2px dotted #999;
      margin-left: 8px;
      height: 1.5rem;
    }

    /* 2. クイズ・スタンプラリー（ミッション） */
    .mission-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mission-card {
      border: 2px dashed #AAA;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mission-text {
      font-size: 0.95rem;
      font-weight: bold;
      line-height: 1.4;
    }

    .stamp-circle {
      width: 45px;
      height: 45px;
      border: 2px dotted var(--main-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #888;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* 3. おえかき・ぬりえスペース */
    .drawing-space {
      border: 2px dashed #999;
      border-radius: 10px;
      height: 280px;
      position: relative;
      background-color: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drawing-hint {
      color: #BBB;
      font-size: 1.2rem;
      font-weight: bold;
      pointer-events: none;
    }

    /* 画面表示用（印刷時には非表示にするボタン等） */
    .no-print {
      text-align: center;
      margin-bottom: 20px;
    }

    .print-btn {
      background-color: var(--main-color);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    @media print {
      .no-print {
        display: none;
      }
      .section-box {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>

<div class="no-print">
  <button class="print-btn" onclick="window.print()">🛈 このページをいんさつする</button>
</div>

<div class="page-container">
  <h1 class="header-title">🎈 たびの きっずのーと 🎈</h1>

  <!-- 1. めあて・じこしょうかい -->
  <section class="section-box">
    <div class="section-title">✏️ じこしょうかい & めあて</div>
    <div class="profile-fields">
      <div class="field-line">
        <span>なまえ：</span>
        <div class="line"></div>
      </div>
      <div class="field-line">
        <span>たびの めあて：</span>
        <div class="line"></div>
      </div>
      <div class="field-line">
        <span>いちばん たのしみなこと：</span>
        <div class="line"></div>
      </div>
    </div>
  </section>

  <!-- 2. クイズ・スタンプラリー -->
  <section class="section-box">
    <div class="section-title">🔍 みっしょん（見つけたらスタンプを押してね！）</div>
    <div class="mission-grid">
      <div class="mission-card">
        <div class="mission-text">🚗 あかい くるまを<br>3だい みつける</div>
        <div class="stamp-circle">スタンプ</div>
      </div>
      <div class="mission-card">
        <div class="mission-text">🌸 きれいな はなを<br>みつける</div>
        <div class="stamp-circle">スタンプ</div>
      </div>
      <div class="mission-card">
        <div class="mission-text">🤝 みんなに<br>「ありがとう」を いう</div>
        <div class="stamp-circle">スタンプ</div>
      </div>
      <div class="mission-card">
        <div class="mission-text">♨️ おふろ・おんせんに<br>はいる</div>
        <div class="stamp-circle">スタンプ</div>
      </div>
    </div>
  </section>

  <!-- 3. おえかき・ぬりえスペース -->
  <section class="section-box">
    <div class="section-title">🎨 じゆうに おえかきしよう！</div>
    <div class="drawing-space">
      <span class="drawing-hint">ここに えを かいてね！</span>
    </div>
  </section>
</div>

</body>
</html>
