<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラプラスに会いに行く旅 🌸 宮城家族旅行のしおり</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .tab-btn.active {
      background-color: #22c55e;
      color: white;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .is-now-card {
      border: 2px solid #ef4444 !important;
      animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-16 font-sans antialiased">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-6 shadow-md rounded-b-3xl text-center relative overflow-hidden">
    <div class="absolute -right-6 -bottom-6 opacity-20 text-8xl">
      <i class="fa-solid fa-water"></i>
    </div>
    
    <!-- kids.html へのリンクボタン（「こども用」に短縮） -->
    <a href="kids.html" target="_blank" class="absolute top-4 right-4 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-md transition-all flex items-center gap-1.5 shadow-sm border border-white/30 z-20">
      <i class="fa-solid fa-print"></i>
      <span>こども用</span>
    </a>

    <div class="relative z-10">
      <span class="bg-emerald-700/50 text-emerald-100 text-xs px-3 py-1 rounded-full font-bold tracking-wide uppercase mb-2 inline-block">宮城家族旅行のしおり</span>
      <h1 class="text-2xl font-extrabold tracking-tight mb-1">ラプラスに会いに行く旅 🌸</h1>
      <p class="text-emerald-100 text-sm font-medium">2027年3月21日(土) 〜 3月22日(日)</p>
    </div>
  </header>

  <!-- ナビゲーションタブ -->
  <div class="sticky top-2 z-30 max-w-md mx-auto px-4 my-3">
    <nav class="bg-white/90 backdrop-blur-md p-1.5 rounded-2xl shadow-lg border border-slate-100 flex justify-between gap-1 text-xs font-bold">
      <button onclick="switchTab('schedule')" id="tab-btn-schedule" class="tab-btn active flex-1 py-2 rounded-xl transition-all text-center">日程</button>
      <button onclick="switchTab('members')" id="tab-btn-members" class="tab-btn flex-1 py-2 rounded-xl transition-all text-center text-slate-600">メンバー</button>
      <button onclick="switchTab('spots')" id="tab-btn-spots" class="tab-btn flex-1 py-2 rounded-xl transition-all text-center text-slate-600">スポット</button>
      <button onclick="switchTab('gourmet')" id="tab-btn-gourmet" class="tab-btn flex-1 py-2 rounded-xl transition-all text-center text-slate-600">グルメ</button>
      <button onclick="switchTab('other')" id="tab-btn-other" class="tab-btn flex-1 py-2 rounded-xl transition-all text-center text-slate-600">その他</button>
    </nav>
  </div>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto px-4 space-y-4">
    <!-- スケジュールコンテンツ略（既存そのまま） -->
  </main>

  <script>
    function switchTab(tab) {
      const tabs = ['schedule', 'members', 'spots', 'gourmet', 'other'];
      tabs.forEach(t => {
        const content = document.getElementById(`content-${t}`);
        if(content) content.classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        if(btn) { btn.classList.remove('active'); btn.classList.add('text-slate-600'); }
      });

      const activeContent = document.getElementById(`content-${tab}`);
      if(activeContent) activeContent.classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      if(activeBtn) { activeBtn.classList.add('active'); activeBtn.classList.remove('text-slate-600'); }
    }
  </script>
</body>
</html>
